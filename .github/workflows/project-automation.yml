name: Project Board Automation

on:
  issues:
    types: [opened, reopened, transferred, labeled, closed]
  pull_request:
    types: [opened, reopened, closed]

permissions:
  issues: write
  pull-requests: write

jobs:
  check-token:
    name: Check project token
    runs-on: ubuntu-latest
    outputs:
      has-token: ${{ steps.check.outputs.has-token }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.NEREUS_PROJECT_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "has-token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-token=false" >> "$GITHUB_OUTPUT"
          fi

  sync-project:
    name: Sync issue/PR to project
    needs: check-token
    if: needs.check-token.outputs.has-token == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.NEREUS_PROJECT_TOKEN }}
          script: |
            const PROJECT_ID = "PVT_kwDOEqfhoc4Bf4NK";
            const FIELD_STATUS = "PVTSSF_lADOEqfhoc4Bf4NKzhaH3t0";
            const OPT = {
              "Todo": "81c0b234",
              "In Review": "df0b8ed0",
              "Done": "e3ef08db",
            };

            const issue = context.payload.issue;
            const pr = context.payload.pull_request;
            const contentId = (issue || pr).node_id;

            let status = "Todo";
            if (pr) status = "In Review";
            if ((issue && issue.state === "closed") || (pr && pr.state === "closed")) status = "Done";

            const added = await github.graphql(`
              mutation {
                addProjectV2ItemById(input: { projectId: "${PROJECT_ID}", contentId: "${contentId}" }) {
                  item { id }
                }
              }
            `);
            const itemId = added.addProjectV2ItemById.item.id;

            await github.graphql(`
              mutation {
                updateProjectV2ItemFieldValue(input: {
                  projectId: "${PROJECT_ID}",
                  itemId: "${itemId}",
                  fieldId: "${FIELD_STATUS}",
                  value: { singleSelectOptionId: "${OPT[status]}" }
                }) { projectV2Item { id } }
              }
            `);

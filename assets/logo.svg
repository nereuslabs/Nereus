<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Nereus 2.0 Official Animated Pixel Art Icon: The Socratic Lighthouse -->
  <defs>
    <filter id="light-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="16" flood-color="#00f5d4" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <style>
      @keyframes beam-sweep {
        0%, 100% { opacity: 0.95; }
        50% { opacity: 0.45; }
      }
      @keyframes lantern-flare {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.65; }
      }
      .beam-primary {
        animation: beam-sweep 2.8s ease-in-out infinite;
      }
      .lantern-core {
        animation: lantern-flare 1.8s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Dark Canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect width="506" height="506" x="3" y="3" rx="105" fill="none" stroke="#1b2537" stroke-width="3"/>

  <!-- 32x32 Pixel Art Grid scaled to 11px per pixel, centered at offset (80, 80) -->
  <g transform="translate(80, 80)" shape-rendering="crispEdges" filter="url(#light-glow)">
    <!-- Palette:
         Beacon Light Beam: #00F5D4 & #FFFFFF
         Lantern Glass:     #E0FBFC
         Tower White:       #FFFFFF
         Tower Accent/Red:  #FF0055 (Cyber Coral)
         Cliff/Rock:        #1B2537 & #384860
         Ocean Waves:       #00BBF9 & #4361EE
    -->

    <!-- BEACON LIGHT BEAMS (Radiating to the Right with CSS animation) -->
    <g class="beam-primary">
      <polygon points="176,88 352,22 352,66" fill="#00F5D4" opacity="0.3"/>
      <polygon points="176,88 352,77 352,143" fill="#00F5D4" opacity="0.55"/>
      <polygon points="176,88 352,99 352,121" fill="#FFFFFF" opacity="0.9"/> <!-- Intense core beam -->
    </g>

    <!-- LIGHTHOUSE ROOF / CAP -->
    <rect x="165" y="44" width="22" height="11" fill="#FF0055"/>
    <rect x="154" y="55" width="44" height="11" fill="#1B2537"/>
    <rect x="143" y="66" width="66" height="11" fill="#1B2537"/>

    <!-- LANTERN ROOM (Light source) -->
    <rect x="154" y="77" width="44" height="22" fill="#E0FBFC"/>
    <rect x="165" y="77" width="22" height="22" fill="#FFFFFF" class="lantern-core"/>
    <!-- Iron railings -->
    <rect x="132" y="99" width="88" height="11" fill="#FF0055"/>

    <!-- TOWER TIER 1 (Red Accent) -->
    <rect x="143" y="110" width="66" height="33" fill="#FF0055"/>

    <!-- TOWER TIER 2 (White Block with window) -->
    <rect x="143" y="143" width="66" height="44" fill="#FFFFFF"/>
    <rect x="165" y="154" width="22" height="22" fill="#0B0F19"/> <!-- Small pixel window -->

    <!-- TOWER TIER 3 (Red Accent) -->
    <rect x="132" y="187" width="88" height="33" fill="#FF0055"/>

    <!-- TOWER BASE (White block on foundation) -->
    <rect x="132" y="220" width="88" height="33" fill="#FFFFFF"/>
    <rect x="165" y="231" width="22" height="22" fill="#1B2537"/> <!-- Heavy door -->

    <!-- ROCKY CLIFF FOUNDATION -->
    <rect x="99" y="253" width="154" height="22" fill="#384860"/>
    <rect x="77" y="275" width="187" height="22" fill="#1B2537"/>
    <rect x="66" y="297" width="209" height="22" fill="#1B2537"/>

    <!-- CRASHING OCEAN WAVES AT BASE -->
    <rect x="0" y="319" width="352" height="22" fill="#00BBF9"/>
    <rect x="22" y="308" width="66" height="11" fill="#00F5D4"/> <!-- Foam crest -->
    <rect x="242" y="308" width="88" height="11" fill="#00F5D4"/> <!-- Foam crest -->
    <rect x="0" y="341" width="352" height="11" fill="#4361EE"/> <!-- Deep water -->
  </g>
</svg>

services:
  app:
    # Interactive CLI (python main.py uses input()/human-in-the-loop). Gated behind a
    # profile so a plain `docker compose up` does NOT start a TTY-less CLI that
    # would immediately EOFError on stdin. Run on demand, e.g.:
    #   docker compose --profile cli run --rm app --new-session --user-id <uuid>
    profiles: ["cli"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: nereus-app
    environment:
      - ENV=development
      - LOG_LEVEL=INFO
      # OpenRouter unified API — replaces the local Ollama service (was 6-8GB RAM).
      - LLM_PROVIDER=${LLM_PROVIDER:-openrouter}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openrouter/free}
      - OPENROUTER_TIMEOUT=120
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-openrouter}
      - OPENROUTER_EMBED_MODEL=${OPENROUTER_EMBED_MODEL:-openai/text-embedding-3-small}
      - CONTEXT_MAX_TOKENS=8000
      - NEREUS_RUN_LIVE=${NEREUS_RUN_LIVE:-0}
      # Multi-user persistence (Issue #8/#57): set USER_STORAGE=redis to back
      # UserProfile store on Redis instead of the local SQLite file.
      - USER_STORAGE=${USER_STORAGE:-sqlite}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./materials:/app/materials
    depends_on:
      - chromadb
      - redis
    networks:
      - nereus-net

  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: nereus-ui
    command: chainlit run src/nereus/ui/app.py --host 0.0.0.0 --port 7457
    environment:
      - ENV=development
      - LOG_LEVEL=INFO
      - LLM_PROVIDER=${LLM_PROVIDER:-openrouter}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openrouter/free}
      - OPENROUTER_TIMEOUT=120
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-openrouter}
      - OPENROUTER_EMBED_MODEL=${OPENROUTER_EMBED_MODEL:-openai/text-embedding-3-small}
      - RETRIEVER_TOP_K=5
      - CONTEXT_MAX_TOKENS=8000
      - USER_STORAGE=${USER_STORAGE:-sqlite}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./materials:/app/materials
    ports:
      - "7457:7457"
    depends_on:
      - chromadb
    networks:
      - nereus-net

  ingest:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: nereus-ingest
    profiles: ["ragger"]
    command: >
      sh -c "python scripts/ingest_materials.py --materials materials --clear"
    environment:
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-openrouter}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_EMBED_MODEL=${OPENROUTER_EMBED_MODEL:-openai/text-embedding-3-small}
      - SENTENCE_TRANSFORMERS_MODEL=${SENTENCE_TRANSFORMERS_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./materials:/app/materials
    depends_on:
      - chromadb
    networks:
      - nereus-net

  chromadb:
    image: chromadb/chroma:latest
    container_name: nereus-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - nereus-net

  redis:
    image: redis:7-alpine
    container_name: nereus-redis
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nereus-net

volumes:
  chroma_data:
  redis_data:

networks:
  nereus-net:
    driver: bridge

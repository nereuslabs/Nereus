services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: nereus-app
    environment:
      - ENV=development
      - LOG_LEVEL=INFO
      - LLM_PROVIDER=${LLM_PROVIDER:-stub}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=gemma4:31b
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - OLLAMA_TIMEOUT=120
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - EMBEDDING_PROVIDER=stub
      - OLLAMA_EMBED_BASE_URL=http://ollama:11434
      - CONTEXT_MAX_TOKENS=8000
      - NEREUS_RUN_LIVE=${NEREUS_RUN_LIVE:-0}
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./materials:/app/materials
    depends_on:
      - ollama
      - chromadb
    networks:
      - nereus-net

  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: nereus-ui
    command: chainlit run src/nereus/ui/app.py --host 0.0.0.0 --port 7457
    environment:
      - ENV=development
      - LOG_LEVEL=INFO
      - LLM_PROVIDER=${LLM_PROVIDER:-stub}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=gemma4:31b
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-stub}
      - OLLAMA_EMBED_BASE_URL=${OLLAMA_EMBED_BASE_URL:-http://ollama:11434}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      - RETRIEVER_TOP_K=5
      - CONTEXT_MAX_TOKENS=8000
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./materials:/app/materials
    ports:
      - "7457:7457"
    depends_on:
      - ollama
      - chromadb
    networks:
      - nereus-net

  ingest:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: nereus-ingest
    profiles: ["ragger"]
    command: >
      sh -c "python scripts/ingest_materials.py --materials materials --clear"
    environment:
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-stub}
      - SENTENCE_TRANSFORMERS_MODEL=${SENTENCE_TRANSFORMERS_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_EMBED_BASE_URL=${OLLAMA_EMBED_BASE_URL:-http://ollama:11434}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./materials:/app/materials
    depends_on:
      - chromadb
    networks:
      - nereus-net

  ollama:
    image: ollama/ollama:latest
    container_name: nereus-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - nereus-net

  chromadb:
    image: chromadb/chroma:latest
    container_name: nereus-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - nereus-net

volumes:
  ollama_data:
  chroma_data:

networks:
  nereus-net:
    driver: bridge
